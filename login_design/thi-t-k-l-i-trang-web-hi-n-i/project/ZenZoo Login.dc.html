<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/fonts.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/colors.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/typography.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/spacing.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/elevation.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/tokens/base.css">
<link rel="stylesheet" href="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/styles.css">
<script src="_ds/manlab-design-system-019e1f11-71f2-7be6-9831-c1db2b42c8f8/_ds_bundle.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--slate-50)}
  .zzl-field:focus{outline:none;border-color:var(--brand) !important;box-shadow:0 0 0 3px var(--focus-ring,rgba(28,80,201,.18)) !important}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--slate-50);font-family:var(--font-sans);">

  <div style="width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;">

    <!-- brand -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;">
      <img src="assets/zenzoo-mark.png" alt="ZenZoo" style="width:52px;height:52px;object-fit:contain;display:block;">
      <div style="text-align:center;">
        <div style="font:var(--fw-extra) 24px/1 var(--font-sans);letter-spacing:-.01em;"><span style="color:#3FB2A6;">Zen</span><span style="color:#1E6CA1;">Zoo</span></div>
        <div style="font:var(--fw-semibold) 10px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint);margin-top:7px;">Admin Console</div>
      </div>
    </div>

    <!-- card -->
    <div style="width:100%;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:28px 28px 26px;">
      <h1 style="font:var(--fw-bold) 19px/1.2 var(--font-sans);letter-spacing:-.01em;color:var(--text-strong);margin:0 0 4px;">Đăng nhập quản trị</h1>
      <p style="font:var(--fw-regular) 13px/1.5 var(--font-sans);color:var(--text-muted);margin:0 0 22px;">Khu vực giới hạn — chỉ dành cho quản trị viên ZenZoo.</p>

      <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label for="zzl-email" style="font:var(--fw-semibold) 12px/1 var(--font-sans);color:var(--text-strong);">Email</label>
          <input id="zzl-email" class="zzl-field" type="email" autocomplete="username" placeholder="admin@zenzoo.app" style="height:42px;width:100%;padding:0 13px;border:1px solid var(--border-default);border-radius:var(--radius-md);font:var(--fw-regular) 14px/1 var(--font-sans);color:var(--text-strong);background:var(--surface-card);transition:border-color .15s, box-shadow .15s;">
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <label for="zzl-pass" style="font:var(--fw-semibold) 12px/1 var(--font-sans);color:var(--text-strong);">Mật khẩu</label>
            <span style="font:var(--fw-medium) 12px/1 var(--font-sans);color:var(--text-link);cursor:pointer;">Quên mật khẩu?</span>
          </div>
          <div style="position:relative;display:flex;align-items:center;">
            <input id="zzl-pass" class="zzl-field" type="{{ passType }}" autocomplete="current-password" placeholder="••••••••" style="height:42px;width:100%;padding:0 42px 0 13px;border:1px solid var(--border-default);border-radius:var(--radius-md);font:var(--fw-regular) 14px/1 var(--font-sans);color:var(--text-strong);background:var(--surface-card);transition:border-color .15s, box-shadow .15s;">
            <button type="button" onClick="{{ togglePass }}" aria-label="Hiện/ẩn mật khẩu" style="position:absolute;right:4px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--text-muted);border-radius:var(--radius-sm);">
              {{ eyeIcon }}
            </button>
          </div>
        </div>

        <label style="display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;margin-top:-2px;">
          <input type="checkbox" onChange="{{ toggleRemember }}" checked="{{ remember }}" style="width:16px;height:16px;accent-color:var(--brand);cursor:pointer;">
          <span style="font:var(--fw-regular) 13px/1 var(--font-sans);color:var(--text-body);">Ghi nhớ thiết bị này</span>
        </label>

        <button type="submit" style="height:42px;width:100%;border:none;border-radius:var(--radius-md);background-color:var(--brand);color:#fff;cursor:pointer;font:var(--fw-semibold) 14px/1 var(--font-sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s;" style-hover="background-color:var(--blue-700)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          Đăng nhập
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px;">
        <span style="flex:1;height:1px;background:var(--border-subtle);"></span>
        <span style="font:var(--fw-medium) 11px/1 var(--font-sans);color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;">hoặc</span>
        <span style="flex:1;height:1px;background:var(--border-subtle);"></span>
      </div>

      <button type="button" style="height:42px;width:100%;border:1px solid var(--border-default);border-radius:var(--radius-md);background-color:var(--surface-card);color:var(--text-strong);cursor:pointer;font:var(--fw-semibold) 13.5px/1 var(--font-sans);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background-color .15s;" style-hover="background-color:var(--slate-50)">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Đăng nhập với Google Workspace
      </button>
    </div>

    <!-- footer -->
    <div style="display:flex;align-items:center;gap:7px;margin-top:22px;font:var(--fw-regular) 12px/1.4 var(--font-sans);color:var(--text-faint);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Kết nối được mã hóa · ZenZoo Admin v2.4.0
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { showPass: false, remember: true };

  ic(inner) {
    return React.createElement('svg', {
      width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
      strokeWidth: 1.75, strokeLinecap: 'round', strokeLinejoin: 'round',
      dangerouslySetInnerHTML: { __html: inner },
    });
  }

  renderVals() {
    const show = this.state.showPass;
    const eyeOpen = '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
    const eyeOff = '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>';
    return {
      passType: show ? 'text' : 'password',
      eyeIcon: this.ic(show ? eyeOff : eyeOpen),
      remember: this.state.remember,
      togglePass: () => this.setState({ showPass: !this.state.showPass }),
      toggleRemember: () => this.setState({ remember: !this.state.remember }),
      onSubmit: (e) => { e.preventDefault(); },
    };
  }
}
</script>
</body>
</html>
