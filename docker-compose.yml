services:
  postgres:
    image: postgres:16-alpine
    container_name: zenzoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zenzoo
      POSTGRES_USER: zenzoo
      POSTGRES_PASSWORD: zenzoo_dev
    ports:
      - "5432:5432"
    volumes:
      - zenzoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenzoo -d zenzoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: zenzoo_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: node:22-alpine
    container_name: zenzoo_backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install; npx prisma db push; npx prisma generate; npm run prisma:seed; npm run dev"
    environment:
      DATABASE_URL: postgresql://zenzoo:zenzoo_dev@postgres:5432/zenzoo?schema=public
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - zenzoo_backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zenzoo_postgres_data:
  zenzoo_backend_node_modules:
